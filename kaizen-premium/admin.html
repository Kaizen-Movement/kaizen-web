<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kaizen Control</title><link rel="stylesheet" href="/admin.css"></head><body><main class="admin-shell"><section class="login-card" id="loginView"><div class="mark">K</div><div class="eyebrow">PRIVATE CONTROL</div><h1>Kaizen Control</h1><p>Authorized access only.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><div class="status" id="loginStatus"></div></form></section><section class="dashboard hidden" id="dashboard"><header><div><div class="eyebrow">KAIZEN / ADMIN</div><h1>Store Control</h1></div><div class="admin-actions"><a href="/" target="_blank">View store ↗</a><button id="logoutBtn">Log out</button></div></header><div class="notice" id="configNotice"></div><div class="admin-grid"><aside><div class="panel-title">Products</div><div class="toolbar"><button id="seedBtn">Import base catalog</button><button id="newBtn">New product</button></div><div class="product-list" id="adminProducts"></div></aside><section class="editor"><div class="panel-title">Product editor</div><form id="productForm"><input type="hidden" id="productId"><label>Name<input id="productName" required></label><label>Slug<input id="productSlug" required></label><div class="two"><label>Price (USD)<input id="productPrice" type="number" min="0" step="0.01" required></label><label>Category<select id="productCategory"><option>Attraction</option><option>Improvement</option><option>Lifestyle</option><option>Success</option></select></label></div><label>Description<textarea id="productDescription" rows="5"></textarea></label><label>Product image<div class="image-preview" id="imagePreview"><span>No image</span></div><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Image URL<input id="imageUrl" placeholder="Filled automatically after upload"></label><label class="toggle"><input id="productActive" type="checkbox" checked><span>Visible in store</span></label><button class="save">Save product</button><div class="status" id="saveStatus"></div></form></section></div></section></main><script src="/config.js"></script><script src="/catalog.js"></script><script src="/admin.js"></script></body></html>
